# .github/workflows/ci.yml
name: ci-cd-cm
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: Build y pruebas unitarias y de aceptacion
        run: ./mvnw -B verify
      - name: Cobertura de codigo
        uses: codecov/codecov-action@v4
        with:
          files: backend/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

  package-publish:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    env:
      IMAGEN: ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t "$IMAGEN" ./backend
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "${{ env.IMAGEN }}"
          exit-code: "1"
          severity: CRITICAL
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: docker push "$IMAGEN"
      - uses: sigstore/cosign-installer@v3
      - name: Firma de la imagen (cosign, sin claves)
        run: cosign sign --yes "$IMAGEN"

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  movil:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: movil } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
