# .github/workflows/ci.yml -- canalizacion CI/CD (base: lst:agro9-ci)
name: ci-cd
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: Build y pruebas
        run: ./mvnw -B verify

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build

  movil:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: movil } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  publicar-imagenes:
    needs: [backend, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir imagenes
        run: |
          docker build -t ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }} ./backend
          docker build -t ghcr.io/${{ github.repository }}/web:${{ github.ref_name }} ./web
      - name: Escaneo Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
          exit-code: "1"
          severity: CRITICAL
      - name: Publicar
        run: |
          docker push ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository }}/web:${{ github.ref_name }}
