# Sin listener en 1883: solo MQTT sobre TLS con certificado de cliente
per_listener_settings true
listener 8883
tls_version tlsv1.3
cafile   /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/pasarela.crt
keyfile  /etc/mosquitto/certs/pasarela.key
require_certificate true
use_identity_as_username true
allow_anonymous false
acl_file /etc/mosquitto/acl
