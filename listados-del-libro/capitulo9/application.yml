# src/main/resources/application.yml (fragmento)
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        agrocadena.alerta.latencia: true
      slo:
        agrocadena.alerta.latencia: 10s, 30s
