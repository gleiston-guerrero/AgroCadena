# backend/src/main/resources/application.yml
spring:
  application:
    name: agrocadena-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agrocadena}
    username: ${DB_USER:agrocadena}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update        # crea/actualiza tablas desde @Entity
    open-in-view: false

mqtt:
  enabled: ${MQTT_ENABLED:true}
  broker: ${MQTT_BROKER:ssl://localhost:8883}
  client-id: agrocadena-backend
  topic-lectura: agrocadena/lectura
  username: backend
  password: ${MQTT_PASSWORD}
  ca-file: ${MQTT_CA_FILE:}   # CA del broker (infra/mosquitto/certs/ca.crt)

server:
  port: 8080
  forward-headers-strategy: framework   # respeta X-Forwarded-Proto del Ingress

logging:
  level:
    ec.uteq.agrocadena: INFO

agrocadena:
  reintento-ms: 30000          # cola de reintento (cap. 7)
  alertas-ms: 5000             # despacho de alertas a la app movil
  fcm:
    credenciales: ${FCM_CREDENCIALES:}   # cuenta de servicio de Firebase
  jwt:
    issuer: ${JWT_ISSUER:https://auth.agrocadena.ec}   # perfil prod (cap. 8)

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db, mqtt   # base de datos y broker
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        agrocadena.alerta.latencia: true
      slo:
        agrocadena.alerta.latencia: 10s, 30s
