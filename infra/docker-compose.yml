# infra/docker-compose.yml
services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: agrocadena
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: agrocadena
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrocadena"]
      interval: 5s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["8883:8883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mqttdata:/mosquitto/data

  backend:
    build: ../backend
    depends_on:
      postgres: { condition: service_healthy }
      mosquitto: { condition: service_started }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/agrocadena
      DB_PASSWORD: ${DB_PASSWORD}
      MQTT_BROKER: ssl://mosquitto:8883
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_CA_FILE: /certs/ca.crt
    volumes:
      - ./mosquitto/certs/ca.crt:/certs/ca.crt:ro
    ports: ["8080:8080"]

  web:
    build: ../web
    depends_on: [backend]
    ports: ["8081:80"]

volumes:
  pgdata:
  mqttdata:
