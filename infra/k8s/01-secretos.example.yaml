# Copiar como 01-secretos.yaml, cambiar valores y NO subirlo al repositorio.
# Los certificados del broker se cargan aparte:
#   kubectl -n agrocadena create secret generic mosquitto-certs \
#     --from-file=../mosquitto/certs/ca.crt --from-file=../mosquitto/certs/broker.crt \
#     --from-file=../mosquitto/certs/broker.key
#   kubectl -n agrocadena create secret generic mosquitto-passwd --from-file=../mosquitto/passwd
apiVersion: v1
kind: Secret
metadata:
  name: agrocadena-secretos
  namespace: agrocadena
type: Opaque
stringData:
  DB_PASSWORD: cambiar_en_produccion
  POSTGRES_PASSWORD: cambiar_en_produccion
  MQTT_PASSWORD: cambiar_backend
  JWT_ISSUER: https://auth.agrocadena.ec
