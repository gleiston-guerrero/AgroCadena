# infra/k8s/backend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: agrocadena
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: ghcr.io/gleiston-guerrero/agrocadena/backend:v1.4.0
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef: { name: agrocadena-secretos }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: prod }
            - { name: DB_URL, value: "jdbc:postgresql://postgres:5432/agrocadena" }
            - { name: MQTT_BROKER, value: "ssl://mosquitto:8883" }
            - { name: MQTT_CA_FILE, value: /certs/ca.crt }
          volumeMounts:
            - { name: ca-mqtt, mountPath: /certs, readOnly: true }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 20
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 40
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits:   { cpu: "1", memory: 768Mi }
      volumes:
        - name: ca-mqtt
          secret:
            secretName: mosquitto-certs
            items: [{ key: ca.crt, path: ca.crt }]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: agrocadena
spec:
  selector: { app: backend }
  ports:
    - port: 80
      targetPort: 8080
