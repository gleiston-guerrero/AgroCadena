# .github/workflows/ci.yml
name: ci-cd-cm
on:
  push:
    branches: [main]
    tags:     ["v*"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build & tests
        run: ./mvnw -B verify
      - name: Codigo cobertura
        uses: codecov/codecov-action@v4

  package-publish:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }} ./agrocadena-backend
./agrocadena-backend
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with: { image-ref: ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }} }
      - name: Push
        run: docker push ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}
