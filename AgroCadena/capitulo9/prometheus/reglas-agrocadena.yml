# prometheus/reglas-agrocadena.yml
groups:
  - name: agrocadena-slo
    rules:
      - alert: LatenciaAlertaAlta
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(agrocadena_alerta_latencia_seconds_bucket[5m]))) > 30
        for: 5m
        labels: { severity: critica }
        annotations:
          summary: "Latencia p95 de alerta superior a 30 s"
          runbook_url: "https://runbook.agrocadena.example/latencia-alerta"
      - alert: PresupuestoErrorEnRiesgo
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[1h]))
            / sum(rate(http_server_requests_seconds_count[1h])) > 0.005
        for: 15m
        labels: { severity: alta }
        annotations:
          summary: "Tasa de error horaria por encima del 0,5 %"
          runbook_url: "https://runbook.agrocadena.example/tasa-error"
      - alert: ContenedorSilencioso
        expr: time() - agrocadena_contenedor_ultimo_reporte_seconds > 900
        for: 5m
        labels: { severity: media }
        annotations:
          summary: "Contenedor {{ $labels.contenedor }} sin lecturas en 15 min"
          runbook_url: "https://runbook.agrocadena.example/sin-lecturas"
