			# application.yml
spring:
	application: { name: agrocadena-backend }
		datasource:
		url: jdbc:postgresql://localhost:5432/agrocadena
		username: agrocadena
		password: ${DB_PASSWORD}
	jpa:
		hibernate.ddl-auto: update # crea/actualiza tablas desde @Entity
		properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
mqtt:
	broker:  ssl://broker.agrocadena.ec:8883
	client-id: agrocadena-backend
	topic-lectura: agrocadena/lectura
	username: backend
	password: ${MQTT_PASSWORD}
server: { port: 8080 }
logging.level.ec.uteq.agrocadena: INFO
